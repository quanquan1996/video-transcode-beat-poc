  # ---------- production trigger: object under input/ -> MediaConvert + Fargate routes ----------
  TriggerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Statement: [{Effect: Allow, Principal: {Service: events.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies:
        - PolicyName: start
          PolicyDocument: {Statement: [{Effect: Allow, Action: states:StartExecution, Resource: !Ref Pipeline}]}
  Trigger:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket: {name: [!Ref Bucket]}
          object: {key: [{prefix: input/}]}
      Targets:
        - Id: sfn
          Arn: !Ref Pipeline
          RoleArn: !GetAtt TriggerRole.Arn
          InputTransformer:
            InputPathsMap: {b: $.detail.bucket.name, k: $.detail.object.key, id: $.id}
            InputTemplate: '{"bucket": "<b>", "key": "<k>", "id": "<id>", "routes": {"mc": false, "fargate": true, "lambdaX86": false, "lambdaArm": false, "gpu": false}, "gpus": []}'

Outputs:
  BucketName: {Value: !Ref Bucket}
  BuildX86: {Value: !Ref BuildX86}
  BuildArm: {Value: !Ref BuildArm}
  RepoUri: {Value: !GetAtt Repo.RepositoryUri}
  StateMachineArn: {Value: !Ref Pipeline}
  Cluster: {Value: !Ref Cluster}
  GpuTask1:
    Condition: HasGpu1
    Value: !Sub "${Gpu1Type}|${GpuTask1}|${Gpu1Streams}"
  GpuTask2:
    Condition: HasGpu2
    Value: !Sub "${Gpu2Type}|${GpuTask2}|${Gpu2Streams}"
  GpuTask3:
    Condition: HasGpu3
    Value: !Sub "${Gpu3Type}|${GpuTask3}|${Gpu3Streams}"
  GpuTask4:
    Condition: HasGpu4
    Value: !Sub "${Gpu4Type}|${GpuTask4}|${Gpu4Streams}"
  GpuTask5:
    Condition: HasGpu5
    Value: !Sub "${Gpu5Type}|${GpuTask5}|${Gpu5Streams}"
