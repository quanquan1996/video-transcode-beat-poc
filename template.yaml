AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Video transcode + beat-tracking POC. S3 -> Step Functions; side-by-side routes:
  MediaConvert, ECS Fargate (CPU), Lambda x86 / arm64, ECS on GPU EC2 (NVDEC/NVENC). Generated file.

Parameters:
  SegmentCount:
    Type: Number
    Default: 8
    Description: Parallel ffmpeg slices on Fargate.
  LambdaSegments:
    Type: Number
    Default: 16
    Description: Parallel ffmpeg slices on Lambda.
  SegmentCpu:
    Type: String
    Default: "8192"
    AllowedValues: ["2048", "4096", "8192", "16384"]
  BeatCpu:
    Type: String
    Default: "4096"
    AllowedValues: ["1024", "2048", "4096", "8192"]
  McAcceleration:
    Type: String
    Default: PREFERRED
    AllowedValues: [DISABLED, PREFERRED, ENABLED]
    Description: MediaConvert Accelerated transcoding (Professional tier).
  LambdaReady:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to true once the Lambda images exist in ECR (deploy.sh handles this).
  GpuDesired:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: Instances per GPU slot (1 while testing, 0 to stop paying).
  Gpu1Type:
    Type: String
    Default: ""
    Description: GPU slot 1 instance type (empty = off), e.g. g6.xlarge
  Gpu1Gpus:
    Type: String
    Default: "1"
    Description: GPUs per task for slot 1 ("1", or 0.125 / 0.25 / 0.5 for g6f fractional GPUs)
  Gpu1Streams:
    Type: String
    Default: "4"
    Description: Parallel slices of one video on the slot 1 GPU (lower it for small-memory fractional GPUs)
  Gpu2Type:
    Type: String
    Default: ""
    Description: GPU slot 2 instance type (empty = off), e.g. g6.xlarge
  Gpu2Gpus:
    Type: String
    Default: "1"
    Description: GPUs per task for slot 2 ("1", or 0.125 / 0.25 / 0.5 for g6f fractional GPUs)
  Gpu2Streams:
    Type: String
    Default: "4"
    Description: Parallel slices of one video on the slot 2 GPU (lower it for small-memory fractional GPUs)
  Gpu3Type:
    Type: String
    Default: ""
    Description: GPU slot 3 instance type (empty = off), e.g. g6.xlarge
  Gpu3Gpus:
    Type: String
    Default: "1"
    Description: GPUs per task for slot 3 ("1", or 0.125 / 0.25 / 0.5 for g6f fractional GPUs)
  Gpu3Streams:
    Type: String
    Default: "4"
    Description: Parallel slices of one video on the slot 3 GPU (lower it for small-memory fractional GPUs)
  Gpu4Type:
    Type: String
    Default: ""
    Description: GPU slot 4 instance type (empty = off), e.g. g6.xlarge
  Gpu4Gpus:
    Type: String
    Default: "1"
    Description: GPUs per task for slot 4 ("1", or 0.125 / 0.25 / 0.5 for g6f fractional GPUs)
  Gpu4Streams:
    Type: String
    Default: "4"
    Description: Parallel slices of one video on the slot 4 GPU (lower it for small-memory fractional GPUs)
  Gpu5Type:
    Type: String
    Default: ""
    Description: GPU slot 5 instance type (empty = off), e.g. g6.xlarge
  Gpu5Gpus:
    Type: String
    Default: "1"
    Description: GPUs per task for slot 5 ("1", or 0.125 / 0.25 / 0.5 for g6f fractional GPUs)
  Gpu5Streams:
    Type: String
    Default: "4"
    Description: Parallel slices of one video on the slot 5 GPU (lower it for small-memory fractional GPUs)

Conditions:
  LambdaOn: !Equals [!Ref LambdaReady, "true"]
  HasGpu1: !Not [!Equals [!Ref Gpu1Type, ""]]
  HasGpu2: !Not [!Equals [!Ref Gpu2Type, ""]]
  HasGpu3: !Not [!Equals [!Ref Gpu3Type, ""]]
  HasGpu4: !Not [!Equals [!Ref Gpu4Type, ""]]
  HasGpu5: !Not [!Equals [!Ref Gpu5Type, ""]]

Mappings:
  Mem:  # Fargate memory per CPU size (2 GB / vCPU)
    "1024": {MB: "2048"}
    "2048": {MB: "4096"}
    "4096": {MB: "8192"}
    "8192": {MB: "16384"}
    "16384": {MB: "32768"}

Resources:
  # ---------- network: public subnets, no NAT (tasks only need egress) ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties: {CidrBlock: 10.42.0.0/16, EnableDnsHostnames: true, EnableDnsSupport: true,
                 Tags: [{Key: Name, Value: !Ref AWS::StackName}]}
  Igw: {Type: AWS::EC2::InternetGateway}
  IgwAttach: {Type: AWS::EC2::VPCGatewayAttachment, Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw}}
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Vpc, CidrBlock: 10.42.0.0/20, MapPublicIpOnLaunch: true,
                 AvailabilityZone: !Select [0, !GetAZs ""]}
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Vpc, CidrBlock: 10.42.16.0/20, MapPublicIpOnLaunch: true,
                 AvailabilityZone: !Select [1, !GetAZs ""]}
  Rt: {Type: AWS::EC2::RouteTable, Properties: {VpcId: !Ref Vpc}}
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: {RouteTableId: !Ref Rt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw}
  RtA: {Type: AWS::EC2::SubnetRouteTableAssociation, Properties: {SubnetId: !Ref SubnetA, RouteTableId: !Ref Rt}}
  RtB: {Type: AWS::EC2::SubnetRouteTableAssociation, Properties: {SubnetId: !Ref SubnetB, RouteTableId: !Ref Rt}}
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties: {VpcId: !Ref Vpc, ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3", RouteTableIds: [!Ref Rt]}
  TaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties: {GroupDescription: egress only, VpcId: !Ref Vpc}

  # ---------- storage ----------
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-${AWS::AccountId}-${AWS::Region}"
      NotificationConfiguration: {EventBridgeConfiguration: {EventBridgeEnabled: true}}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      LifecycleConfiguration: {Rules: [{Id: expire, Status: Enabled, ExpirationInDays: 14}]}
  Repo:
    Type: AWS::ECR::Repository
    Properties: {RepositoryName: !Sub "${AWS::StackName}-worker", EmptyOnDelete: true}

  # ---------- image builds (CloudShell has no Docker): x86 builds ECS + Lambda-x86, arm builds Lambda-arm64 ----------
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Statement: [{Effect: Allow, Principal: {Service: codebuild.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies:
        - PolicyName: build
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: "*"}
              - {Effect: Allow, Action: [ecr:GetAuthorizationToken], Resource: "*"}
              - {Effect: Allow, Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart,
                                          ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage], Resource: !GetAtt Repo.Arn}
              - {Effect: Allow, Action: [s3:GetObject, s3:GetObjectVersion], Resource: !Sub "${Bucket.Arn}/build/*"}
  BuildX86:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-build-x86"
      ServiceRole: !GetAtt BuildRole.Arn
      Source: {Type: S3, Location: !Sub "${Bucket}/build/src.zip", BuildSpec: container/buildspec.yml}
      Artifacts: {Type: NO_ARTIFACTS}
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables: [{Name: REPO_URI, Value: !GetAtt Repo.RepositoryUri}, {Name: ARCH, Value: x86}]
  BuildArm:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-build-arm64"
      ServiceRole: !GetAtt BuildRole.Arn
      Source: {Type: S3, Location: !Sub "${Bucket}/build/src.zip", BuildSpec: container/buildspec.yml}
      Artifacts: {Type: NO_ARTIFACTS}
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables: [{Name: REPO_URI, Value: !GetAtt Repo.RepositoryUri}, {Name: ARCH, Value: arm64}]

  # ---------- ECS ----------
  Cluster: {Type: AWS::ECS::Cluster, Properties: {ClusterName: !Ref AWS::StackName}}
  Logs: {Type: AWS::Logs::LogGroup, Properties: {LogGroupName: !Sub "/poc/${AWS::StackName}", RetentionInDays: 14}}
  ExecRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Statement: [{Effect: Allow, Principal: {Service: [ecs-tasks.amazonaws.com, lambda.amazonaws.com]}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: s3
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: [s3:GetObject, s3:PutObject], Resource: !Sub "${Bucket.Arn}/*"}
              - {Effect: Allow, Action: [s3:ListBucket], Resource: !GetAtt Bucket.Arn}
  BeatTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-beat"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref BeatCpu
      Memory: !FindInMap [Mem, !Ref BeatCpu, MB]
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: worker
          Image: !Sub "${Repo.RepositoryUri}:ecs"
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: beat}}
  SegTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-segment"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref SegmentCpu
      Memory: !FindInMap [Mem, !Ref SegmentCpu, MB]
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: worker
          Image: !Sub "${Repo.RepositoryUri}:ecs"
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: seg}}
  ConcatTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-concat"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: worker
          Image: !Sub "${Repo.RepositoryUri}:ecs"
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: concat}}

  # ---------- GPU EC2 capacity (one optional ASG per slot) ----------
  GpuRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  GpuProfile: {Type: AWS::IAM::InstanceProfile, Properties: {Roles: [!Ref GpuRole]}}

  GpuLt1:
    Type: AWS::EC2::LaunchTemplate
    Condition: HasGpu1
    Properties:
      LaunchTemplateData:
        ImageId: "{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/gpu/recommended/image_id}}"
        InstanceType: !Ref Gpu1Type
        IamInstanceProfile: {Arn: !GetAtt GpuProfile.Arn}
        SecurityGroupIds: [!Ref TaskSg]
        BlockDeviceMappings: [{DeviceName: /dev/xvda, Ebs: {VolumeSize: 80, VolumeType: gp3}}]
        MetadataOptions: {HttpTokens: required}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${Cluster} >> /etc/ecs/ecs.config
        TagSpecifications: [{ResourceType: instance, Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-${Gpu1Type}"}]}]
  GpuAsg1:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: HasGpu1
    UpdatePolicy:
      AutoScalingReplacingUpdate: {WillReplace: true}
    Properties:
      MinSize: "0"
      MaxSize: "1"
      DesiredCapacity: !Ref GpuDesired
      VPCZoneIdentifier: [!Ref SubnetA, !Ref SubnetB]
      LaunchTemplate: {LaunchTemplateId: !Ref GpuLt1, Version: !GetAtt GpuLt1.LatestVersionNumber}
  GpuTask1:
    Type: AWS::ECS::TaskDefinition
    Condition: HasGpu1
    Properties:
      Family: !Sub "${AWS::StackName}-gpu1"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      Cpu: "3072"
      Memory: "12288"
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Sub "${Repo.RepositoryUri}:ecs"
          ResourceRequirements: [{Type: GPU, Value: !Ref Gpu1Gpus}]
          Environment: [{Name: NVIDIA_DRIVER_CAPABILITIES, Value: all}]
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: gpu1}}
  GpuLt2:
    Type: AWS::EC2::LaunchTemplate
    Condition: HasGpu2
    Properties:
      LaunchTemplateData:
        ImageId: "{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/gpu/recommended/image_id}}"
        InstanceType: !Ref Gpu2Type
        IamInstanceProfile: {Arn: !GetAtt GpuProfile.Arn}
        SecurityGroupIds: [!Ref TaskSg]
        BlockDeviceMappings: [{DeviceName: /dev/xvda, Ebs: {VolumeSize: 80, VolumeType: gp3}}]
        MetadataOptions: {HttpTokens: required}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${Cluster} >> /etc/ecs/ecs.config
        TagSpecifications: [{ResourceType: instance, Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-${Gpu2Type}"}]}]
  GpuAsg2:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: HasGpu2
    UpdatePolicy:
      AutoScalingReplacingUpdate: {WillReplace: true}
    Properties:
      MinSize: "0"
      MaxSize: "1"
      DesiredCapacity: !Ref GpuDesired
      VPCZoneIdentifier: [!Ref SubnetA, !Ref SubnetB]
      LaunchTemplate: {LaunchTemplateId: !Ref GpuLt2, Version: !GetAtt GpuLt2.LatestVersionNumber}
  GpuTask2:
    Type: AWS::ECS::TaskDefinition
    Condition: HasGpu2
    Properties:
      Family: !Sub "${AWS::StackName}-gpu2"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      Cpu: "3072"
      Memory: "12288"
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Sub "${Repo.RepositoryUri}:ecs"
          ResourceRequirements: [{Type: GPU, Value: !Ref Gpu2Gpus}]
          Environment: [{Name: NVIDIA_DRIVER_CAPABILITIES, Value: all}]
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: gpu2}}
  GpuLt3:
    Type: AWS::EC2::LaunchTemplate
    Condition: HasGpu3
    Properties:
      LaunchTemplateData:
        ImageId: "{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/gpu/recommended/image_id}}"
        InstanceType: !Ref Gpu3Type
        IamInstanceProfile: {Arn: !GetAtt GpuProfile.Arn}
        SecurityGroupIds: [!Ref TaskSg]
        BlockDeviceMappings: [{DeviceName: /dev/xvda, Ebs: {VolumeSize: 80, VolumeType: gp3}}]
        MetadataOptions: {HttpTokens: required}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${Cluster} >> /etc/ecs/ecs.config
        TagSpecifications: [{ResourceType: instance, Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-${Gpu3Type}"}]}]
  GpuAsg3:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: HasGpu3
    UpdatePolicy:
      AutoScalingReplacingUpdate: {WillReplace: true}
    Properties:
      MinSize: "0"
      MaxSize: "1"
      DesiredCapacity: !Ref GpuDesired
      VPCZoneIdentifier: [!Ref SubnetA, !Ref SubnetB]
      LaunchTemplate: {LaunchTemplateId: !Ref GpuLt3, Version: !GetAtt GpuLt3.LatestVersionNumber}
  GpuTask3:
    Type: AWS::ECS::TaskDefinition
    Condition: HasGpu3
    Properties:
      Family: !Sub "${AWS::StackName}-gpu3"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      Cpu: "3072"
      Memory: "12288"
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Sub "${Repo.RepositoryUri}:ecs"
          ResourceRequirements: [{Type: GPU, Value: !Ref Gpu3Gpus}]
          Environment: [{Name: NVIDIA_DRIVER_CAPABILITIES, Value: all}]
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: gpu3}}
  GpuLt4:
    Type: AWS::EC2::LaunchTemplate
    Condition: HasGpu4
    Properties:
      LaunchTemplateData:
        ImageId: "{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/gpu/recommended/image_id}}"
        InstanceType: !Ref Gpu4Type
        IamInstanceProfile: {Arn: !GetAtt GpuProfile.Arn}
        SecurityGroupIds: [!Ref TaskSg]
        BlockDeviceMappings: [{DeviceName: /dev/xvda, Ebs: {VolumeSize: 80, VolumeType: gp3}}]
        MetadataOptions: {HttpTokens: required}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${Cluster} >> /etc/ecs/ecs.config
        TagSpecifications: [{ResourceType: instance, Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-${Gpu4Type}"}]}]
  GpuAsg4:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: HasGpu4
    UpdatePolicy:
      AutoScalingReplacingUpdate: {WillReplace: true}
    Properties:
      MinSize: "0"
      MaxSize: "1"
      DesiredCapacity: !Ref GpuDesired
      VPCZoneIdentifier: [!Ref SubnetA, !Ref SubnetB]
      LaunchTemplate: {LaunchTemplateId: !Ref GpuLt4, Version: !GetAtt GpuLt4.LatestVersionNumber}
  GpuTask4:
    Type: AWS::ECS::TaskDefinition
    Condition: HasGpu4
    Properties:
      Family: !Sub "${AWS::StackName}-gpu4"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      Cpu: "3072"
      Memory: "12288"
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Sub "${Repo.RepositoryUri}:ecs"
          ResourceRequirements: [{Type: GPU, Value: !Ref Gpu4Gpus}]
          Environment: [{Name: NVIDIA_DRIVER_CAPABILITIES, Value: all}]
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: gpu4}}
  GpuLt5:
    Type: AWS::EC2::LaunchTemplate
    Condition: HasGpu5
    Properties:
      LaunchTemplateData:
        ImageId: "{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/gpu/recommended/image_id}}"
        InstanceType: !Ref Gpu5Type
        IamInstanceProfile: {Arn: !GetAtt GpuProfile.Arn}
        SecurityGroupIds: [!Ref TaskSg]
        BlockDeviceMappings: [{DeviceName: /dev/xvda, Ebs: {VolumeSize: 80, VolumeType: gp3}}]
        MetadataOptions: {HttpTokens: required}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${Cluster} >> /etc/ecs/ecs.config
        TagSpecifications: [{ResourceType: instance, Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-${Gpu5Type}"}]}]
  GpuAsg5:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: HasGpu5
    UpdatePolicy:
      AutoScalingReplacingUpdate: {WillReplace: true}
    Properties:
      MinSize: "0"
      MaxSize: "1"
      DesiredCapacity: !Ref GpuDesired
      VPCZoneIdentifier: [!Ref SubnetA, !Ref SubnetB]
      LaunchTemplate: {LaunchTemplateId: !Ref GpuLt5, Version: !GetAtt GpuLt5.LatestVersionNumber}
  GpuTask5:
    Type: AWS::ECS::TaskDefinition
    Condition: HasGpu5
    Properties:
      Family: !Sub "${AWS::StackName}-gpu5"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      Cpu: "3072"
      Memory: "12288"
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Sub "${Repo.RepositoryUri}:ecs"
          ResourceRequirements: [{Type: GPU, Value: !Ref Gpu5Gpus}]
          Environment: [{Name: NVIDIA_DRIVER_CAPABILITIES, Value: all}]
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: gpu5}}

  # ---------- Lambda (container images, 10 GB = ~6 vCPU) ----------
  FnX86:
    Type: AWS::Lambda::Function
    Condition: LambdaOn
    Properties:
      FunctionName: !Sub "${AWS::StackName}-x86"
      PackageType: Image
      Code: {ImageUri: !Sub "${Repo.RepositoryUri}:lambda-x86"}
      Architectures: [x86_64]
      MemorySize: 10240
      EphemeralStorage: {Size: 10240}
      Timeout: 900
      Role: !GetAtt TaskRole.Arn
  FnArm:
    Type: AWS::Lambda::Function
    Condition: LambdaOn
    Properties:
      FunctionName: !Sub "${AWS::StackName}-arm64"
      PackageType: Image
      Code: {ImageUri: !Sub "${Repo.RepositoryUri}:lambda-arm64"}
      Architectures: [arm64]
      MemorySize: 10240
      EphemeralStorage: {Size: 10240}
      Timeout: 900
      Role: !GetAtt TaskRole.Arn

  # ---------- MediaConvert ----------
  McRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Statement: [{Effect: Allow, Principal: {Service: mediaconvert.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies:
        - PolicyName: s3
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: [s3:GetObject, s3:PutObject], Resource: !Sub "${Bucket.Arn}/*"}

  # ---------- orchestration ----------
  SfnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Statement: [{Effect: Allow, Principal: {Service: states.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies:
        - PolicyName: run
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: [mediaconvert:CreateJob, mediaconvert:GetJob, mediaconvert:CancelJob], Resource: "*"}
              - {Effect: Allow, Action: [ecs:RunTask], Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${AWS::StackName}-*"}
              - {Effect: Allow, Action: [ecs:StopTask, ecs:DescribeTasks], Resource: "*"}
              - {Effect: Allow, Action: [lambda:InvokeFunction], Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*"}
              - {Effect: Allow, Action: iam:PassRole, Resource: [!GetAtt McRole.Arn, !GetAtt ExecRole.Arn, !GetAtt TaskRole.Arn]}
              - {Effect: Allow, Action: [events:PutTargets, events:PutRule, events:DescribeRule],
                 Resource: [!Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForMediaConvertJobRule",
